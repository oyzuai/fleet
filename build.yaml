# Build targets for fleet. Prepare the executor context before selecting it.
builds:
  # One root module; preview.2 captures a build action for each main package.
  # Multi-main builds require `oyzu build --isolated fleet`.
  fleet:
    uses: go/app
    path: .

  # Prepare this context with tooling/prepare-executor-image.sh first.
  executor-image:
    uses: docker/image
    path: deploy/executor-image
    platforms: [linux/amd64]
    with:
      repository: ghcr.io/oyzuai/oyzu-pool-executor
