# Build targets for fleet and its public executor image.
builds:
  # One root module; preview.2 captures a build action for each main package.
  # Multi-main builds require `oyzu build --isolated fleet`.
  fleet:
    uses: go/app
    path: .

  executor-image:
    uses: docker/image
    path: deploy/executor-image
    platforms: [linux/amd64]
    materialize:
      - from: fleet
        artifact: executor
        into: rootfs/usr/local/bin
    fetches:
      # Raw fetches keep the URL's final filename; no unpack is needed.
      - name: oyzu
        url: https://github.com/oyzuai/oyzu-releases/releases/download/oyzu/v0.2.3/oyzu-linux-x86_64
        sha256: 99230d5b6cc452ea3e796e1fa8149abb6e21eb4ee85cc830d08d92e282d427d7
      - name: oyzu-shim
        url: https://github.com/oyzuai/oyzu-releases/releases/download/oyzu/v0.2.3/oyzu-shim-linux-x86_64
        sha256: 7d3284db39d96e8b817f8a244b8cd6a9d01c540a4501552c3b9dc4c0618cf653
      - name: oyzu-notices
        url: https://github.com/oyzuai/oyzu-releases/releases/download/oyzu/v0.2.3/oyzu-notices-linux-x86_64.txt
        sha256: d3765497ef0c2fa5ff5272d825be7d745501053c181b87f76853dbc147b341cb
      - name: crun
        url: https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1-linux-amd64
        sha256: 86d1e6a0e76945975d3aebfab39cbc6a26eea15f1c3fc66b6776d19e5dc346a0
      - name: crun-source
        url: https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.gz
        sha256: 99d036d95113552b6df66c7c879432835504bf0e525fc0372745071df129527b
      - name: ca-certificates
        url: https://archive.ubuntu.com/ubuntu/pool/main/c/ca-certificates/ca-certificates_20260816ubuntu0.24.04.1_all.deb
        sha256: 8a0a754aaafed72cc8efb8c1731808133284a84fbfc76a4fcc73fce9e01b4187
    with:
      repository: ghcr.io/oyzuai/oyzu-pool-executor
