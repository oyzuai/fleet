# Build targets for fleet. `oyzu build` builds them all.
builds:
  # One application target per shipped main, all in the root Go module.
  pool-server:
    uses: go/app
    path: cmd/pool-server
  manager:
    uses: go/app
    path: cmd/manager
  executor:
    uses: go/app
    path: cmd/executor

  # Prepare this context with tooling/prepare-executor-image.sh first.
  executor-image:
    uses: docker/image
    path: deploy/executor-image
    platforms: [linux/amd64]
    with:
      repository: ghcr.io/oyzuai/oyzu-pool-executor
