# Tools for fleet. `oyzu build` builds and tests the module (build.yaml).
# Run `oyzu pin` on a machine that can reach the download hosts and commit
# the regenerated oyzu.lock.
[tools]
go = "1.24"

# Real Linux container diagnostic, using disposable secret-free controls.
[tasks.readiness-container-proof]
argv = ["bash", "tooling/readiness-container-proof.sh"]

[tasks.container-runtime-proof]
argv = ["bash", "tooling/container-runtime-proof.sh"]

# Requires FLEET_NATIVE_CLI pointing at the compiled runtime-input candidate.
[tasks.runtime-inputs-proof]
argv = ["go", "test", "./executor", "-run", "^TestNativeRuntimeInputs$", "-count=1", "-v"]
env = { FLEET_RUNTIME_PROOF_REQUIRED = "1" }

[publish.destinations.executor]
kind = "oci"
registry = "https://ghcr.io"
repository = "oyzuai/oyzu-pool-executor"
artifacts = ["executor-image/image"]
usernameEnv = "OYZU_IMAGE_REGISTRY_USERNAME"
passwordEnv = "OYZU_IMAGE_REGISTRY_PASSWORD"

# The workflow writes per-run evidence and matching ephemeral public keys into
# the job checkout's oyzu.toml. Subject signing always uses the release workflow's OIDC identity.
