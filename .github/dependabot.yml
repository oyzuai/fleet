# Dependency proposals do not change release automation or merge requirements.
version: 2
updates:
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: daily
    time: 06:30
    timezone: America/New_York
  open-pull-requests-limit: 3
  assignees:
  - micahlmartin
  groups:
    routine-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-dependencies:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
    time: 06:30
    timezone: America/New_York
  open-pull-requests-limit: 3
  assignees:
  - micahlmartin
  groups:
    routine-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-dependencies:
      applies-to: security-updates
      patterns:
      - '*'
