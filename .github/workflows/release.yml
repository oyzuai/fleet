# Builds, signs and publishes a fleet release when a version tag is pushed.
#
# Every release carries, for each binary and platform:
#   - the binary in a .tar.gz with LICENSE.md and additional license notices,
#   - a CycloneDX SBOM of the modules compiled into it,
# plus SHA256SUMS over all of them, its Sigstore bundle, and SLSA build
# provenance attested by GitHub for every asset.
#
# Signing is Sigstore keyless, as for the tool index (platform IMPL-126):
# cosign gets a short-lived certificate for this workflow's GitHub OIDC
# identity and records the signature in the public Rekor log. There is no key
# to hold. Verify a download with:
#   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/oyzuai/fleet/.github/workflows/release.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
#   sha256sum --check --ignore-missing SHA256SUMS
#   gh attestation verify oyzu-pool-manager_<version>_linux_amd64.tar.gz --repo oyzuai/fleet
# Renaming this file changes the signing identity clients check.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # gh release create
  id-token: write      # the OIDC token for cosign and attestations
  attestations: write  # SLSA provenance
  packages: write      # public executor image

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GitHub-hosted only: the signing certificate records the runner
    # environment, and self-hosted runners are not trusted to sign.
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scope oyzu configuration and tools to this job
        run: |
          job_home="$RUNNER_TEMP/fleet-release/home"
          mkdir -p "$job_home/.config"
          {
            echo "HOME=$job_home"
            echo "XDG_CONFIG_HOME=$job_home/.config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/fleet-release/data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/fleet-release/cache"
            echo "OYZU_USER_CONFIG=$job_home/.config/oyzu/config.toml"
          } >> "$GITHUB_ENV"

      - name: Install pinned public oyzu release
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/oyzu-release"
          mkdir -p "$install_dir" "$HOME" "$XDG_CONFIG_HOME"
          base=https://github.com/oyzuai/oyzu-releases/releases/download/oyzu/v0.2.3
          # SHA-256 values from the public release asset API.
          curl -fsSL --retry 3 "$base/oyzu-linux-x86_64" -o "$install_dir/oyzu"
          curl -fsSL --retry 3 "$base/oyzu-shim-linux-x86_64" -o "$install_dir/oyzu-shim"
          curl -fsSL --retry 3 "$base/oyzu-notices-linux-x86_64.txt" -o "$install_dir/oyzu-notices.txt"
          (cd "$install_dir" && sha256sum --check <<'CHECKSUMS'
          99230d5b6cc452ea3e796e1fa8149abb6e21eb4ee85cc830d08d92e282d427d7  oyzu
          7d3284db39d96e8b817f8a244b8cd6a9d01c540a4501552c3b9dc4c0618cf653  oyzu-shim
          d3765497ef0c2fa5ff5272d825be7d745501053c181b87f76853dbc147b341cb  oyzu-notices.txt
          CHECKSUMS
          )
          chmod +x "$install_dir/oyzu" "$install_dir/oyzu-shim"
          "$install_dir/oyzu" --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Enable published plugin previews for this job
        run: oyzu config set --global plugins.preview true

      - name: Acquire fleet's locked plugins and build requirements
        # Non-frozen builds acquire missing published plugins. Frozen exec
        # cannot bootstrap an empty store; do not replace the committed lock.
        run: oyzu build fleet

      - name: Resolve fleet's locked Go environment
        run: oyzu exec -- go version

      - name: Check the tag is a release version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not a vMAJOR.MINOR.PATCH tag"; exit 1; }

      - name: Install cyclonedx-gomod
        run: |
          GOBIN="$RUNNER_TEMP/release-tools" oyzu exec -- go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"

      - name: Build all release archives and SBOMs
        run: |
          oyzu exec -- bash tooling/release-build.sh "${GITHUB_REF_NAME#v}" build/release

      - name: Prepare and build public executor image with oyzu
        run: |
          bash tooling/prepare-executor-image.sh "${GITHUB_REF_NAME#v}"
          oyzu build executor-image

      - name: Install cosign
        # v4.1.2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      # Image-only stopgap: switch to `oyzu publish` with keyless intent once oyzu row 23 ships.
      # Docker pushes via a tag; require its remote digest to equal the image
      # manifest oyzu built, and sign/verify that immutable digest, never the tag.
      - name: Push image and verify its digest (Docker stopgap)
        id: image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(jq -er '[.artifacts[] | select(.name == "image") | .path] | if length == 1 then .[0] else error("expected one image") end' dist/manifest.json)
          digest=$(jq -er '.artifacts[] | select(.name == "image") | .ociDigest' dist/manifest.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          config=$(tar -xOf "dist/$archive" "blobs/sha256/${digest#sha256:}" | jq -er '.config.digest')
          [[ "$config" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load --input "dist/$archive"
          test "$(docker image inspect --format '{{.Id}}' "$config")" = "$config"
          image=ghcr.io/oyzuai/oyzu-pool-executor
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$config" "$image:${GITHUB_REF_NAME#v}"
          docker push "$image:${GITHUB_REF_NAME#v}"
          test "$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image:${GITHUB_REF_NAME#v}" | jq -r .digest)" = "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign and verify the image digest keylessly (cosign stopgap)
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="ghcr.io/oyzuai/oyzu-pool-executor@$IMAGE_DIGEST"
          cosign sign --yes "$image"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image"

      - name: Sign the checksums
        working-directory: build/release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Verify as a user will
        working-directory: build/release
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: build/release/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Linux amd64 and arm64 archives (each with notices and a CycloneDX SBOM):
          - oyzu-pool-server_${GITHUB_REF_NAME#v}_linux_<arch>.tar.gz
          - oyzu-pool-manager_${GITHUB_REF_NAME#v}_linux_<arch>.tar.gz
          - oyzu-executor_${GITHUB_REF_NAME#v}_linux_<arch>.tar.gz

          Executor image (linux/amd64 only; no arm64 oyzu CLI release yet): ghcr.io/oyzuai/oyzu-pool-executor:${GITHUB_REF_NAME#v}
          Pinned manager --image: ghcr.io/oyzuai/oyzu-pool-executor@${{ steps.image.outputs.digest }}

          Verify downloads:
          \`\`\`bash
          cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify oyzu-pool-server_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz --repo oyzuai/fleet
          cosign verify --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}' --certificate-oidc-issuer https://token.actions.githubusercontent.com ghcr.io/oyzuai/oyzu-pool-executor@${{ steps.image.outputs.digest }}
          \`\`\`
          The image digest was signed keylessly and verified with cosign (temporary Docker publication stopgap).
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" $prerelease build/release/*
